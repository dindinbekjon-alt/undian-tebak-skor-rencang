<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undian Tebak Skor — Rencang Kang Dindin</title>
<style>
:root{--navy:#072b63;--blue:#1264c7;--gold:#f6c84a;--light:#eef5ff;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(145deg,#061d44,#0b4b93 60%,#092754);color:#fff;min-height:100vh;padding:18px}.wrap{max-width:1000px;margin:auto}.header{text-align:center;margin:8px 0 20px}.eyebrow{letter-spacing:3px;color:#ffda73;font-weight:800;font-size:12px}.header h1{margin:5px 0;font-size:clamp(24px,5vw,42px);line-height:1.1}.header h2{margin:6px;color:#cfe4ff;letter-spacing:2px;font-size:16px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{background:#ffffff12;border:1px solid #ffffff32;border-radius:20px;padding:16px;box-shadow:0 12px 30px #0002;backdrop-filter:blur(8px)}.wheelbox{position:relative;max-width:480px;margin:auto}.wheelbox canvas{width:100%;aspect-ratio:1;display:block}.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:0;border-bottom:30px solid #ffdf75;filter:drop-shadow(0 2px 2px #0008)}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:5px solid #ffdc70;background:#08336d;border-radius:50%;width:82px;height:82px;display:grid;place-items:center;font-weight:900;box-shadow:0 3px 10px #0005}.spin{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:20px;font-weight:900;color:#082b61;background:linear-gradient(90deg,#ffe58a,#f5bd35);margin:12px 0;cursor:pointer}.spin:disabled{opacity:.5}.winner{min-height:65px;text-align:center;background:#ffffff15;border-radius:14px;padding:12px;font-size:23px;font-weight:900;color:#ffe17d}.sub{font-size:13px;color:#d6e7ff;margin:8px 0}.label{font-size:13px;font-weight:700;margin:12px 0 5px;display:block}input,textarea{width:100%;border-radius:10px;border:1px solid #b9c9e3;padding:11px;font:inherit;color:#172b48;background:#fff}textarea{min-height:180px;resize:vertical}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:10px 12px;background:#d9e9ff;color:#07336d;font-weight:800;cursor:pointer}.btn.gold{background:#ffdc70}.btn.danger{background:#ffd4d4;color:#8a1d1d}.check{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}.check input{width:auto}.history{padding-left:20px;margin:8px 0;max-height:150px;overflow:auto}.history li{margin:5px 0}.foot{text-align:center;color:#c6dbf8;font-size:12px;margin-top:16px}.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:9;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:13px}.center{width:70px;height:70px}}
</style></head><body><div class="wrap"><header class="header"><div class="eyebrow">EVENT GIVEAWAY</div><h1>UNDIAN TEBAK SKOR</h1><h2>RENCANG KANG DINDIN</h2></header><main class="layout"><section class="panel"><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas><div class="center">SPIN</div></div><button class="spin" id="spin">PUTAR UNDIAN 🎉</button><div class="winner" id="winner">Pemenang akan muncul di sini</div><div class="sub" id="status">Masukkan peserta dan tekan putar.</div><label class="label">Nama Hadiah</label><input id="prize" value="Doorprize"><label class="check"><input id="remove" type="checkbox" checked> Hapus pemenang dari daftar agar tidak menang lagi</label></section><section class="panel"><label class="label">Daftar Peserta (satu nama per baris)</label><textarea id="names" placeholder="Contoh:&#10;Andi&#10;Budi&#10;Citra&#10;Deni"></textarea><div class="sub" id="count">0 peserta</div><div class="controls"><button class="btn" id="shuffle">Acak daftar</button><button class="btn gold" id="clear">Kosongkan</button></div><h3>🏆 Riwayat Pemenang</h3><ol class="history" id="history"></ol><div class="controls"><button class="btn" id="copy">Salin hasil</button><button class="btn danger" id="resetHistory">Reset riwayat</button></div></section></main><footer class="foot">Aplikasi undian offline • Rencang Kang Dindin</footer></div>
<script>
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),names=document.getElementById('names'),winner=document.getElementById('winner'),status=document.getElementById('status'),spinBtn=document.getElementById('spin'),historyEl=document.getElementById('history');let entries=[],angle=0,spinning=false,history=[];const colors=['#f8cf55','#1769c4','#f5f8ff','#0b3b78','#f1b82c','#3888dc','#e9f2ff','#154e98'];
function sync(){entries=names.value.split('\n').map(s=>s.trim()).filter(Boolean);document.getElementById('count').textContent=entries.length+' peserta';draw()}
function draw(){ctx.clearRect(0,0,700,700);let n=Math.max(entries.length,1),arc=Math.PI*2/n;for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(350,350);ctx.arc(350,350,335,angle+i*arc,angle+(i+1)*arc);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();if(entries[i]){ctx.save();ctx.translate(350,350);ctx.rotate(angle+(i+.5)*arc);ctx.textAlign='right';ctx.fillStyle=i%colors.length===1||i%colors.length===3||i%colors.length===5?'#fff':'#092b5d';ctx.font='bold '+Math.max(13,Math.min(23,220/n))+'px system-ui';let label=entries[i];if(label.length>22)label=label.slice(0,20)+'…';ctx.fillText(label,300,8);ctx.restore()}}ctx.beginPath();ctx.arc(350,350,335,0,Math.PI*2);ctx.strokeStyle='#f8d46a';ctx.lineWidth=9;ctx.stroke()}
function celebrate(){for(let i=0;i<100;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[Math.floor(Math.random()*colors.length)];e.style.animationDelay=Math.random()*1.1+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
function addHistory(name){let li=document.createElement('li');li.textContent=name+' — '+(document.getElementById('prize').value||'Hadiah');historyEl.prepend(li);history.unshift(li.textContent)}
spinBtn.onclick=()=>{sync();if(spinning||entries.length<1){status.textContent=entries.length<1?'Isi minimal satu peserta dulu.':'Roda sedang berputar…';return}spinning=true;spinBtn.disabled=true;let selected=Math.floor(Math.random()*entries.length),extra=Math.PI*2*(5+Math.random()*5),target=angle+extra;let start=performance.now(),duration=4800;function animate(now){let p=Math.min((now-start)/duration,1),ease=1-Math.pow(1-p,4);angle=target*ease;draw();if(p<1)requestAnimationFrame(animate);else{angle=target%(Math.PI*2);spinning=false;spinBtn.disabled=false;let win=entries[selected];winner.textContent='🎉 '+win+' 🎉';status.textContent='Pemenang '+(document.getElementById('prize').value||'hadiah')+'!';addHistory(win);celebrate();if(document.getElementById('remove').checked){entries.splice(selected,1);names.value=entries.join('\n');sync()}}}requestAnimationFrame(animate)};
names.addEventListener('input',sync);document.getElementById('shuffle').onclick=()=>{entries.sort(()=>Math.random()-.5);names.value=entries.join('\n');sync()};document.getElementById('clear').onclick=()=>{names.value='';sync();winner.textContent='Pemenang akan muncul di sini';status.textContent='Daftar peserta dikosongkan.'};document.getElementById('copy').onclick=async()=>{let text=history.join('\n');if(!text){status.textContent='Belum ada hasil undian.';return}try{await navigator.clipboard.writeText(text);status.textContent='Hasil undian tersalin!'}catch{status.textContent=text}};document.getElementById('resetHistory').onclick=()=>{history=[];historyEl.innerHTML='';status.textContent='Riwayat direset.'};sync();
</script></body></html>
